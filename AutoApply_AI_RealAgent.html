<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoApply AI — Real Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090F;--bg2:#0C101A;--card:#111724;--card2:#161E2E;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.12);
  --g:#00D68F;--g2:#00A86B;--glow:rgba(0,214,143,.1);
  --blue:#5B9CF6;--amber:#F0A500;--red:#F05252;--purple:#9B72F5;--teal:#26D4C8;
  --t1:#EEF2FF;--t2:#7C8BAA;--t3:#3D4A5F;
  --f:'Outfit',sans-serif;--m:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--f);overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
a{color:var(--blue)}a:hover{text-decoration:underline}
.app{display:flex;height:100vh}

/* SIDEBAR */
.side{width:215px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);display:flex;flex-direction:column}
.brand{padding:16px 14px 12px;border-bottom:1px solid var(--b1)}
.brand-row{font-size:14px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
.bmark{width:24px;height:24px;background:var(--g);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.brand-row b{color:var(--g)}
.bsub{margin-top:6px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0}
.dot.on{background:var(--g);box-shadow:0 0 7px var(--g);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.nav{flex:1;padding:8px 6px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--t2);transition:all .15s;margin-bottom:1px;border:1px solid transparent;user-select:none}
.ni:hover{color:var(--t1);background:var(--card)}
.ni.on{color:var(--g);background:var(--glow);border-color:rgba(0,214,143,.14)}
.ni-i{font-size:13px;width:15px;text-align:center;flex-shrink:0}
.nb{margin-left:auto;background:var(--g);color:var(--bg);font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;font-family:var(--m);min-width:16px;text-align:center}
.sfoot{padding:9px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:5px}
.chip{background:var(--card);border:1px solid var(--b2);border-radius:6px;padding:7px 8px}
.chip-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:2px}
.chip-val{font-size:10px;font-family:var(--m);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-val.ok{color:var(--g)}
.chip-val.bad{color:var(--red)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:13px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);flex-shrink:0}
.tb-ttl{font-size:15px;font-weight:700}
.tb-sub{font-size:11px;color:var(--t3);margin-top:1px}
.tb-r{display:flex;gap:6px}
.btn{padding:6px 11px;border-radius:7px;font-size:12px;cursor:pointer;font-family:var(--f);transition:all .15s;border:1px solid var(--b2);background:var(--card);color:var(--t2);white-space:nowrap}
.btn:hover{border-color:var(--g);color:var(--g)}
.btn.go{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:600}
.btn.go:hover{background:var(--g2)}
.btn.stop{background:rgba(240,82,82,.09);border-color:rgba(240,82,82,.25);color:var(--red)}

.page{flex:1;overflow-y:auto;padding:16px 18px}
.card{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:14px 16px}
.ct{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);margin-bottom:9px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.fsb{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.st{font-size:12.5px;font-weight:600;color:var(--t1)}
.sl{font-size:11px;color:var(--g);cursor:pointer}
.sl:hover{text-decoration:underline}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:12px 14px}
.sn{font-size:24px;font-weight:800;font-family:var(--m);margin-bottom:2px}
.cg{color:var(--g)}.cb{color:var(--blue)}.cp{color:var(--purple)}.ca{color:var(--amber)}
.slbl{font-size:11px;color:var(--t2)}
.ssub{font-size:10px;color:var(--t3);margin-top:2px;font-family:var(--m)}

/* FEED */
.feed{max-height:220px;overflow-y:auto}
.fi{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--b1)}
.fi:last-child{border-bottom:none}
.fd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dg{background:var(--g)}.db{background:var(--blue)}.da{background:var(--amber)}.dr{background:var(--red)}.dt{background:var(--teal)}
.ft{font-size:10px;color:var(--t3);font-family:var(--m);min-width:24px;flex-shrink:0;margin-top:2px}
.fx{font-size:11.5px;color:var(--t2);line-height:1.45}
.fx strong{color:var(--t1)}

/* PLATFORM */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pi{background:var(--card2);border:1px solid var(--b1);border-radius:6px;padding:7px 8px;display:flex;align-items:center;gap:5px}
.pn{font-size:11px;color:var(--t1);font-weight:500}
.pc{font-size:10px;color:var(--t3);font-family:var(--m);margin-left:auto}

/* JOB CARDS */
.jgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.jcard{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:12px 14px;transition:border-color .2s}
.jcard:hover{border-color:var(--b2)}
.jcard.hi{border-color:rgba(0,214,143,.2)}
.jh{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.jico{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ji{flex:1;min-width:0}
.jtl{font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jco{font-size:11px;color:var(--t2)}
.mbadge{font-size:11px;font-weight:700;font-family:var(--m);padding:2px 7px;border-radius:5px;flex-shrink:0}
.mhi{background:rgba(0,214,143,.1);color:var(--g)}
.mmd{background:rgba(91,156,246,.1);color:var(--blue)}
.mlo{background:rgba(240,165,0,.1);color:var(--amber)}
.jtags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tag{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--card2);color:var(--t2);border:1px solid var(--b1)}
.tag.live{background:rgba(0,214,143,.08);color:var(--g);border-color:rgba(0,214,143,.2)}
.jdesc{font-size:11px;color:var(--t2);margin-bottom:7px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jrow{display:flex;gap:5px}
.abtn{flex:1;padding:6px;border-radius:6px;background:var(--g);color:var(--bg);border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--f);transition:all .15s}
.abtn:hover{background:var(--g2)}
.abtn:disabled{background:var(--card2);color:var(--t3);cursor:not-allowed}
.dbtn{padding:6px 9px;border-radius:6px;background:transparent;color:var(--t2);border:1px solid var(--b2);font-size:11px;cursor:pointer;font-family:var(--f)}
.dbtn:hover{color:var(--t1)}

/* STATUS BADGES */
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;font-family:var(--m)}
.applied{background:rgba(0,214,143,.1);color:var(--g)}
.interview{background:rgba(91,156,246,.1);color:var(--blue)}
.offer{background:rgba(155,114,245,.1);color:var(--purple)}
.rejected{background:rgba(240,82,82,.1);color:var(--red)}
.packageready{background:rgba(38,212,200,.1);color:var(--teal)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 9px;color:var(--t3);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--b2);background:var(--bg2);white-space:nowrap}
td{padding:8px 9px;color:var(--t2);border-bottom:1px solid var(--b1);vertical-align:middle}
tr:hover td{background:var(--card2)}
.tbold{color:var(--t1);font-weight:500}
.tmono{font-family:var(--m)}
.shi{color:var(--g);font-weight:700;font-family:var(--m)}
.smd{color:var(--blue);font-weight:700;font-family:var(--m)}
.tl{color:var(--blue);cursor:pointer;font-size:11px}
.tl:hover{text-decoration:underline}

/* FORM */
.fg{margin-bottom:10px}
.fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.fh{font-weight:400;text-transform:none;letter-spacing:0;font-size:10px}
.inp{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--t1);font-family:var(--f);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--g)}
.inp::placeholder{color:var(--t3)}
textarea.inp{resize:vertical;min-height:130px;font-size:11px;font-family:var(--m);line-height:1.55}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill-row{display:flex;flex-wrap:wrap;gap:5px}
.pill{padding:5px 10px;border-radius:6px;border:1px solid var(--b2);background:var(--card2);cursor:pointer;font-size:12px;color:var(--t2);transition:all .15s;user-select:none}
.pill:hover{color:var(--t1)}
.pill.on{border-color:rgba(0,214,143,.3);background:var(--glow);color:var(--g)}
.upload-z{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1px dashed var(--b2);border-radius:7px;cursor:pointer;font-size:12px;color:var(--t2);transition:all .15s;margin-top:6px;position:relative}
.upload-z:hover{border-color:var(--g);color:var(--g)}
.upload-z input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.fstat{font-size:10px;margin-top:4px;font-family:var(--m);min-height:13px;color:var(--t3)}
.fstat.ok{color:var(--g)}.fstat.err{color:var(--red)}
.api-row{position:relative}
.api-row .inp{padding-right:38px;font-family:var(--m);font-size:12px;letter-spacing:.04em}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px}
.eye:hover{color:var(--t1)}
.sbtn{width:100%;padding:11px;border-radius:9px;background:var(--g);color:var(--bg);border:none;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--f);transition:all .18s;margin-top:11px}
.sbtn:hover{background:var(--g2);transform:translateY(-1px)}
.sbtn.stop{background:rgba(240,82,82,.1);color:var(--red);border:1px solid rgba(240,82,82,.25)}
.sbtn.stop:hover{background:rgba(240,82,82,.2);transform:none}

/* FILTER */
.fbar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.ftag{padding:4px 10px;border-radius:99px;border:1px solid var(--b2);background:transparent;color:var(--t2);font-size:11px;cursor:pointer;font-family:var(--f);transition:all .15s}
.ftag:hover{color:var(--t1)}
.ftag.on{background:var(--glow);border-color:rgba(0,214,143,.22);color:var(--g)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--b2);border-radius:13px;width:580px;max-width:93vw;max-height:88vh;overflow-y:auto;padding:19px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mttl{font-size:14px;font-weight:700}
.mx{background:transparent;border:1px solid var(--b2);color:var(--t2);width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:12px;font-family:var(--f)}
.mx:hover{color:var(--t1)}
.msec{margin-bottom:11px}
.mst{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:6px}
.mbx{font-size:11.5px;color:var(--t2);line-height:1.65;background:var(--bg);border:1px solid var(--b1);border-radius:7px;padding:10px;font-family:var(--m);white-space:pre-wrap;max-height:190px;overflow-y:auto}
.sw{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sbig{font-size:34px;font-weight:800;font-family:var(--m)}
.srec{font-size:11px;color:var(--t2);max-width:240px;text-align:right;line-height:1.4}
.sbar{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:4px}
.sfill{height:100%;border-radius:99px;transition:width 1.3s}
.pt{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;font-size:11.5px}
.pdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}
.mbtns{display:flex;gap:6px;margin-top:11px}
.mbtn{flex:1;padding:9px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--f);border:none;transition:all .15s;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.mbtn.ok{background:var(--g);color:var(--bg)}
.mbtn.ok:hover{background:var(--g2)}
.mbtn.bl{background:rgba(91,156,246,.15);color:var(--blue);border:1px solid rgba(91,156,246,.25)}
.mbtn.bl:hover{background:rgba(91,156,246,.25)}
.mbtn.no{background:var(--card2);color:var(--t2);border:1px solid var(--b2)}
.mbtn.no:hover{color:var(--t1)}

/* APPLY PACKAGE */
.pkg{background:var(--bg2);border:1px solid var(--b2);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.pkg-ttl{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:7px}
.pkg-step{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--b1)}
.pkg-step:last-child{border-bottom:none}
.pkg-n{width:18px;height:18px;border-radius:50%;background:var(--glow);border:1px solid rgba(0,214,143,.25);color:var(--g);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--m)}
.pkg-t{font-size:12px;color:var(--t2);line-height:1.45;flex:1}
.pkg-t strong{color:var(--t1)}
.pka{padding:4px 9px;border-radius:5px;border:1px solid var(--b2);background:transparent;color:var(--g);font-size:11px;cursor:pointer;font-family:var(--f);white-space:nowrap;flex-shrink:0;transition:all .15s}
.pka:hover{background:var(--glow);border-color:rgba(0,214,143,.3)}
.pka.ext{color:var(--blue);border-color:rgba(91,156,246,.2);text-decoration:none;display:inline-flex;align-items:center}
.pka.ext:hover{background:rgba(91,156,246,.1)}

/* KEY SETUP BANNER */
.key-setup{background:rgba(240,165,0,.07);border:1px solid rgba(240,165,0,.2);border-radius:9px;padding:13px 15px;margin-bottom:12px}
.key-setup-ttl{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.key-setup-body{font-size:12px;color:var(--t2);line-height:1.65}
.key-steps{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.key-step{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2)}
.key-step-n{color:var(--amber);font-weight:700;font-family:var(--m);flex-shrink:0}
.key-ok{background:rgba(0,214,143,.07);border:1px solid rgba(0,214,143,.18);border-radius:9px;padding:10px 13px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g)}

/* MISC */
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--b2);border-top-color:var(--g);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:46px 16px;color:var(--t3)}
.empty .ei{font-size:30px;margin-bottom:7px;opacity:.5}
.empty .et{font-size:13px;color:var(--t2);margin-bottom:3px}
.empty .es{font-size:11px}
.toast{position:fixed;bottom:14px;right:14px;background:var(--card);border:1px solid var(--g);border-radius:9px;padding:9px 13px;font-size:12px;color:var(--t1);z-index:200;animation:pop .2s ease;max-width:290px;pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fa{animation:fa .22s ease}
@keyframes fa{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.xbtn{width:100%;padding:11px;border-radius:9px;background:#1B9463;color:#fff;border:none;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--f);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.xbtn:hover{background:#136B48}
.xbtn:disabled{background:var(--card2);color:var(--t3);cursor:not-allowed}
.src-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--b2);color:var(--teal);background:rgba(38,212,200,.08);margin-left:4px}
.infonote{font-size:11px;color:var(--t2);line-height:1.6;background:rgba(91,156,246,.06);border:1px solid rgba(91,156,246,.15);border-radius:7px;padding:9px 11px;margin-top:8px}
.copied{color:var(--g)!important;border-color:rgba(0,214,143,.3)!important}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="side">
  <div class="brand">
    <div class="brand-row"><div class="bmark">⚡</div>Auto<b>Apply</b> AI</div>
    <div class="bsub"><div class="dot" id="dot"></div><span id="stxt">Agent idle</span></div>
  </div>
  <nav class="nav">
    <div class="ni on" id="n-dash"  onclick="go('dash')"><span class="ni-i">◈</span>Dashboard</div>
    <div class="ni" id="n-setup"    onclick="go('setup')"><span class="ni-i">⚙</span>Setup</div>
    <div class="ni" id="n-jobs"     onclick="go('jobs')"><span class="ni-i">◎</span>Job Matches<span class="nb" id="jb">0</span></div>
    <div class="ni" id="n-apps"     onclick="go('apps')"><span class="ni-i">✦</span>Applications<span class="nb" id="ab">0</span></div>
    <div class="ni" id="n-xls"      onclick="go('xls')"><span class="ni-i">↓</span>Export Excel</div>
  </nav>
  <div class="sfoot">
    <div class="chip">
      <div class="chip-lbl">Gemini AI</div>
      <div class="chip-val" id="keyChip" style="color:var(--red)">Key not set</div>
    </div>
    <div class="chip">
      <div class="chip-lbl">Resume</div>
      <div class="chip-val" id="rchip">Not uploaded</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="tb-ttl" id="ptitle">Dashboard</div>
      <div class="tb-sub" id="psub">Real jobs · Real AI · Totally free</div>
    </div>
    <div class="tb-r">
      <button class="btn" onclick="go('setup')">⚙ Setup</button>
      <button class="btn go" id="agentBtn" onclick="toggleAgent()">▶ Start Agent</button>
    </div>
  </div>
  <div class="page" id="page"></div>
</div>
</div>

<!-- MODAL -->
<div class="ov" id="ov" style="display:none" onclick="closeBg(event)">
  <div class="modal">

let _t = null;
function toast(msg, col = 'var(--g)') {
  if (_t) _t.remove();
  _t = document.createElement('div');
  _t.className = 'toast'; _t.style.borderColor = col; _t.textContent = msg;
  document.body.appendChild(_t);
  setTimeout(() => { if (_t) { _t.style.opacity = '0'; _t.style.transition = 'opacity .3s'; setTimeout(() => { if (_t) { _t.remove(); _t = null; } }, 300); } }, 3200);
}

function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h';
}
function fdt(ts) { return new Date(ts).toLocaleDateString(); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function ini(s) { return (s || '').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?'; }

function copyTxt(txt, btn) {
  const cb = () => { toast('Copied!'); if (btn) { const o = btn.textContent; btn.textContent = '✓ Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 1800); } };
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(cb).catch(() => { fbCopy(txt); cb(); }); }
  else { fbCopy(txt); cb(); }
}
function fbCopy(txt) {
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove();
}

================================================================ */
function setFS(msg, cls = '') { const el = document.getElementById('fstat'); if (el) { el.textContent = msg; el.className = 'fstat' + (cls ? ' ' + cls : ''); } }

async function loadFile(e) {
  const f = e.target.files[0]; if (!f) return;
  setFS('Reading ' + f.name + '…');
  try {
    let txt = '';
    if (f.name.toLowerCase().endsWith('.pdf')) txt = await parsePDF(f);
    else txt = await f.text();
    txt = txt.trim();
    if (!txt || txt.length < 20) throw new Error('File appears empty.');
    S.resume = txt; S.fname = f.name;
    const ta = document.getElementById('rta'); if (ta) ta.value = txt;
    document.getElementById('rchip').textContent = f.name;
    setFS('✓ ' + f.name + ' — ' + (txt.length / 1024).toFixed(1) + ' KB', 'ok');
    toast('Resume loaded: ' + f.name);
  } catch (err) { setFS('⚠ ' + err.message, 'err'); toast(err.message, 'var(--red)'); }
}

async function parsePDF(file) {
  if (typeof pdfjsLib === 'undefined') {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload = res; s.onerror = () => rej(new Error('PDF parser load failed — check internet.'));
      document.head.appendChild(s);
    });
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const ct = await pg.getTextContent();
    let line = '', lastY = null;
    ct.items.forEach(item => {
      if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) { out += line.trim() + '\n'; line = ''; }
      line += item.str + (item.hasEOL ? ' ' : ' ');
      lastY = item.transform[5];
    });
    out += line.trim() + '\n';
  }
  out = out.replace(/\n{3,}/g, '\n\n').trim();
  if (!out || out.length < 30) throw new Error('No text in PDF — may be scanned. Paste text manually.');
  return out;
}

/* ================================================================

================================================================ */
async function callGemini(prompt, maxTokens = 1024) {
  if (!S.geminiKey) throw new Error('No Gemini key configured.');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${S.geminiKey}`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: maxTokens, temperature: 0.7 }
    })
  });
  if (!resp.ok) {
    const e = await resp.json().catch(() => ({}));
    const msg = e.error?.message || 'Gemini API error ' + resp.status;
    if (resp.status === 400) throw new Error('Invalid Gemini key. Check at aistudio.google.com.');
    if (resp.status === 429) throw new Error('Rate limit hit — waiting 30 seconds…');
    throw new Error(msg);
  }
  const d = await resp.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
}

function pJSON(raw) {

}

================================================================ */

// CORS proxies tried in order until one works
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
];

async function fetchWithFallback(url) {
  // 1. Try direct first (works if API supports CORS)
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(7000) });
    if (r.ok) return await r.json();
  } catch (e) { /* fall through */ }
  // 2. Try each CORS proxy
  for (const mkProxy of PROXIES) {
    try {
      const r = await fetch(mkProxy(url), { headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(12000) });
      if (r.ok) return JSON.parse(await r.text());
    } catch (e) { /* try next */ }
  }
  throw new Error('Fetch failed for ' + url + ' — check internet connection.');
}

async function fetchRemoteOK(keyword) {
  addLog('Fetching from <strong>RemoteOK</strong>…', 'b');
  try {
    const data = await fetchWithFallback(`https://remoteok.com/api?tag=${encodeURIComponent(keyword)}`);
    // First item is legal notice, skip it
    const jobs = Array.isArray(data) ? data.slice(1) : [];
    const mapped = jobs.slice(0, 25).map(j => ({
      id: 'rok_' + j.id,
      title: j.position || j.title || 'Unknown Role',
      company: j.company || 'Company',
      location: j.location || 'Remote',
      salary: j.salary || formatSalaryRange(j.salary_min, j.salary_max),
      description: stripHTML(j.description || '').slice(0, 600),
      tags: (j.tags || []).slice(0, 6),
      url: j.url || `https://remoteok.com/l/${j.id}`,
      src: 'RemoteOK',
      postedAt: j.date ? new Date(j.date * 1000).toLocaleDateString() : 'recent',
      score: 0, state: 'new', analysis: null, cl: '', kw: []
    }));
    addLog(`RemoteOK: <strong>${mapped.length} jobs</strong> found`, 'g');
    return mapped;
  } catch (e) {
    addLog('RemoteOK fetch failed: ' + e.message, 'r');
    return [];
  }
}

    return mapped;
  } catch (e) {
    addLog('The Muse fetch failed: ' + e.message, 'r');
    return [];
  }
}

function stripHTML(html) {
  return html
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>/gi, '\n')
    .replace(/<\/li>/gi, '\n')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&nbsp;/g, ' ').replace(/&#39;/g, "'").replace(/&quot;/g, '"')
    .replace(/\s{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

function formatSalaryRange(min, max) {
  if (!min && !max) return '';
  const fmt = n => n >= 1000 ? '$' + Math.round(n / 1000) + 'k' : '$' + n;
  if (min && max) return fmt(min) + '–' + fmt(max);
  if (min) return fmt(min) + '+';
  return 'Up to ' + fmt(max);
}

================================================================ */
async function fetchAllJobs() {
  // Filter out jobs that don't match role/location preferences
  const keyword = S.role.split(' ').slice(-2).join(' '); // use last 2 words for search

  const [remoteOK, arbeitnow, muse] = await Promise.all([
    fetchRemoteOK(keyword),
    fetchArbeitnow(keyword),
    fetchTheMuse(keyword)
  ]);

  let all = [...remoteOK, ...arbeitnow, ...muse];

  // Filter by role relevance (basic keyword match)
  const roleWords = S.role.toLowerCase().split(' ').filter(w => w.length > 2);
  all = all.filter(j => {
    const txt = (j.title + ' ' + j.description + ' ' + j.tags.join(' ')).toLowerCase();
    return roleWords.some(w => txt.includes(w));
  });

  // Remove duplicates by title+company
  const seen = new Set();
  all = all.filter(j => {
    const key = (j.title + j.company).toLowerCase().replace(/\s/g, '');
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });

  // Limit to 30 jobs
  all = all.slice(0, 30);

  if (!all.length) {
    addLog('No jobs found for "' + S.role + '" — try a broader title', 'a');
    toast('No jobs found — try a broader title like "developer" or "designer"', 'var(--amber)');
    return;
  }

  S.jobs = all;
  document.getElementById('jb').textContent = all.length;
  addLog(`Found <strong>${all.length} real jobs</strong> — starting AI scoring with Gemini…`, 'g');
  toast(all.length + ' real jobs found — AI scoring now…');
  if (S.page === 'jobs') draw('jobs');
  if (S.page === 'dash') draw('dash');

  await scoreAll();
}

async function scoreAll() {
  // Score in batches to respect Gemini rate limit (15 req/min)
  let count = 0;
  for (const job of S.jobs) {
    if (!S.running) break;
    await scoreJob(job, true);
    count++;
    // Gemini free tier: 15 RPM — wait 5s every 10 jobs
    if (count % 10 === 0) {
      addLog('Rate limit pause (5s)…', 'a');
      await wait(5000);
    } else {
      await wait(500);
    }
  }
  if (S.running) addLog('All jobs scored. Go to <strong>Job Matches</strong> to apply.', 't');
}

async function scoreJob(job, auto = false) {
  addLog(`Scoring: <strong>${job.title}</strong> at ${job.company} (${job.src})…`, 'b');
  try {
    const a = await getScore(job);
    job.score = a.score; job.analysis = a;
    if (S.page === 'jobs') draw('jobs');
    if (S.page === 'dash') draw('dash');
    if (auto && a.score >= S.thresh) {
      addLog(`${a.score}% — writing cover letter for <strong>${job.company}</strong>…`, 'g');
      await wait(800); // Small gap between API calls
      const pkg = await getPkg(job, a);
      job.cl = pkg.coverLetter || ''; job.kw = pkg.keywords || [];
      logApp(job, a);
    } else if (auto) {
      addLog(`${a.score}% — below threshold, skipped <strong>${job.company}</strong>`, 'a');
      job.state = 'skip';
    }
  } catch (err) {
    if (err.message.includes('Rate limit')) {
      addLog('Rate limit — waiting 30 seconds…', 'a');
      await wait(30000);
      await scoreJob(job, auto); // retry
    } else {
      addLog('Error on ' + job.company + ': ' + err.message, 'r');
    }
  }
}

async function getScore(job) {
  const raw = await callGemini(
`You are an expert ATS recruiter. Score how well this resume matches this job.

RESUME (excerpt):
${S.resume.slice(0, 2000)}

JOB:
Title: ${job.title} at ${job.company}
Location: ${job.location}
Description: ${job.description.slice(0, 500)}
Tags/Skills: ${job.tags.join(', ')}

Return ONLY valid JSON, no markdown, no explanation:
{"score":<integer 30-97 be realistic and specific>,"strengths":["exact matching point 1","exact matching point 2","exact matching point 3"],"gaps":["gap 1","gap 2"],"recommendation":"one honest sentence about fit"}`, 400);
  return pJSON(raw);
}

async function getPkg(job, analysis) {
  const raw = await callGemini(
`Create a job application package for this candidate.

APPLICANT RESUME:
${S.resume.slice(0, 1500)}

JOB:
${job.title} at ${job.company} (${job.location})
${job.description.slice(0, 400)}

Candidate strengths for this role: ${(analysis.strengths || []).join(', ')}

Return ONLY valid JSON, no markdown:
{"coverLetter":"3 paragraphs under 270 words, professional and warm, do NOT start with I am writing to express my interest, reference specific details from this exact job at ${job.company}, connect real experience from resume to role requirements, end with confident call to action","keywords":["keyword1","keyword2","keyword3","keyword4","keyword5"]}`, 900);

}

function logApp(job, analysis) {
  const app = {
    id: S.apps.length + 1, role: job.title, company: job.company, src: job.src,
    loc: job.location, salary: job.salary, score: job.score, url: job.url,
    date: fdt(Date.now()), ts: Date.now(), status: 'Package Ready',
    hasCL: !!job.cl, cl: job.cl, kw: job.kw || [],
    strengths: (analysis.strengths || []).join('; '),
    gaps: (analysis.gaps || []).join('; '),
    note: analysis.recommendation || '', jid: job.id
  };

  addLog(`✓ Package ready: <strong>${job.title}</strong> at ${job.company} — ${job.score}%`, 'g');

      `<div class="empty" style="padding:28px"><div class="ei">📊</div><div class="et">No data yet</div><div class="es">Start the agent and generate packages first</div></div>`}
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px">
    ${[['Total', n, 'cg'], ['Interviews', S.apps.filter(a => a.status === 'Interview').length, 'cb'], ['Offers', S.apps.filter(a => a.status === 'Offer').length, 'cp'], ['Avg Match', avg ? avg + '%' : '—', 'ca']].map(([l, v, c]) => `<div class="stat"><div class="sn ${c}">${v}</div><div class="slbl">${l}</div></div>`).join('')}
  </div>
  <button class="xbtn" id="xbtn" onclick="doExport()" ${!has ? 'disabled' : ''}>⬇ Download Excel — ${n} Applications</button>
  <div style="margin-top:7px;font-size:11px;color:var(--t3);text-align:center;line-height:1.5">
    Columns: Role · Company · Source · Match % · Date · Status · Cover Letter · Keywords · Strengths · Gaps<br>
    Generated in browser — nothing uploaded.
  </div>`;
}

function doExport() {
  if (!S.apps.length) { toast('No applications yet.', 'var(--amber)'); return; }
  const btn = document.getElementById('xbtn');
  if (btn) { btn.textContent = '⏳ Generating…'; btn.disabled = true; }
  try {
    if (typeof XLSX === 'undefined') throw new Error('XLSX library not loaded — check internet connection.');
    const wb = XLSX.utils.book_new();
    const rows = S.apps.map(a => ({
      'ID': a.id, 'Job Title': a.role, 'Company': a.company, 'Source': a.src,
      'Location': a.loc || '', 'Salary': a.salary || '', 'Match Score (%)': a.score,
      'Date': a.date, 'Status': a.status, 'Job URL': a.url || '',
      'Cover Letter Used': a.hasCL ? 'Yes' : 'No',
      'Resume Keywords': (a.kw || []).join(', '),
      'Match Strengths': a.strengths || '', 'Gaps': a.gaps || '',
      'AI Recommendation': a.note || '', 'Cover Letter Text': a.cl || ''
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 5 }, { wch: 30 }, { wch: 25 }, { wch: 12 }, { wch: 18 }, { wch: 14 }, { wch: 13 }, { wch: 12 }, { wch: 14 }, { wch: 35 }, { wch: 17 }, { wch: 30 }, { wch: 50 }, { wch: 40 }, { wch: 40 }, { wch: 80 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Applications');
    const sum = [
      { Metric: 'Total Applications', Value: S.apps.length },
      { Metric: 'Applied', Value: S.apps.filter(a => a.status === 'Applied').length },
      { Metric: 'Interviews', Value: S.apps.filter(a => a.status === 'Interview').length },
      { Metric: 'Offers', Value: S.apps.filter(a => a.status === 'Offer').length },
      { Metric: 'Rejected', Value: S.apps.filter(a => a.status === 'Rejected').length },
      { Metric: 'Avg Match Score', Value: (S.apps.length ? Math.round(S.apps.reduce((s, a) => s + a.score, 0) / S.apps.length) : 0) + '%' },
      { Metric: 'Target Role', Value: S.role },
      { Metric: 'Sources Used', Value: [...new Set(S.apps.map(a => a.src))].join(', ') },
      { Metric: 'Export Date', Value: new Date().toLocaleDateString() }
    ];
    const ws2 = XLSX.utils.json_to_sheet(sum); ws2['!cols'] = [{ wch: 22 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, ws2, 'Summary');
    const fname = 'AutoApply_' + (S.role || 'jobs').replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx';
    XLSX.writeFile(wb, fname);
    toast('Excel downloaded: ' + fname);
    addLog('Excel exported: ' + fname, 't');
  } catch (err) {
    toast('Export failed: ' + err.message, 'var(--red)'); console.error(err);
  } finally {
    if (btn) { btn.textContent = '⬇ Download Excel — ' + S.apps.length + ' Applications'; btn.disabled = false; }
  }
}

/* ================================================================
   MODAL
================================================================ */
function closeBg(e) { if (e.target === document.getElementById('ov')) closeModal(); }
function closeModal() { document.getElementById('ov').style.display = 'none'; }

/* ================================================================
   AGENT TOGGLE
================================================================ */
function toggleAgent() {
  if (!S.running) {
    if (!S.geminiKey) { toast('Add your free Gemini API key first.', 'var(--amber)'); go('setup'); return; }
    if (!S.resume) { toast('Add your resume first.', 'var(--amber)'); go('setup'); return; }
    if (!S.role) { toast('Enter your target job title.', 'var(--amber)'); go('setup'); return; }
    startAgent(); go('dash');
  } else stopAgent();
}

/* ================================================================
   BOOT
================================================================ */
addLog('AutoApply AI ready — go to <strong>Setup</strong> to add your free Gemini key and start.', 't');
go('dash');
</script>
</body>
</html>
